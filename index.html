<meta charset="UTF-8">
<title>Planos de Escenario — Orquesta y Banda Sinfónica</title>
<style>
  :root{
    --bg-page:#F7F8FA;
    --bg-stage:#FFFFFF;
    --grid-line:#C7D6EA;
    --grid-line-major:#A9C0E0;
    --ink:#14335C;
    --ink-dim:#4C6D95;
    --accent:#C97A2B;
    --accent-ink:#7A4712;
    --on-accent:#14335C;
    --box-fill:#EEF3FA;
    --box-fill-tray:#FBEEDD;
    --border:#2B4C78;
    --border-tray:#B5751F;
    --shadow:0 1px 2px rgba(20,51,92,.12);
    --shadow-drag:0 10px 24px rgba(20,51,92,.28);
    --danger:#B23A3A;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-page:#0E1B30;
      --bg-stage:#12274A;
      --grid-line:#23406B;
      --grid-line-major:#2E4F80;
      --ink:#DCE8FA;
      --ink-dim:#8FAAD1;
      --accent:#E4A24E;
      --accent-ink:#FFD9A0;
      --on-accent:#14335C;
      --box-fill:#1C3560;
      --box-fill-tray:#3A2C18;
      --border:#6E93C4;
      --border-tray:#C98A3E;
      --shadow:0 1px 2px rgba(0,0,0,.35);
      --shadow-drag:0 14px 30px rgba(0,0,0,.5);
      --danger:#E27171;
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#0E1B30; --bg-stage:#12274A; --grid-line:#23406B; --grid-line-major:#2E4F80;
    --ink:#DCE8FA; --ink-dim:#8FAAD1; --accent:#E4A24E; --accent-ink:#FFD9A0; --on-accent:#14335C;
    --box-fill:#1C3560; --box-fill-tray:#3A2C18; --border:#6E93C4; --border-tray:#C98A3E;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-drag:0 14px 30px rgba(0,0,0,.5); --danger:#E27171;
  }
  :root[data-theme="light"]{
    --bg-page:#F7F8FA; --bg-stage:#FFFFFF; --grid-line:#C7D6EA; --grid-line-major:#A9C0E0;
    --ink:#14335C; --ink-dim:#4C6D95; --accent:#C97A2B; --accent-ink:#7A4712; --on-accent:#14335C;
    --box-fill:#EEF3FA; --box-fill-tray:#FBEEDD; --border:#2B4C78; --border-tray:#B5751F;
    --shadow:0 1px 2px rgba(20,51,92,.12); --shadow-drag:0 10px 24px rgba(20,51,92,.28); --danger:#B23A3A;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-page);
    color:var(--ink);
    font-family:'Bahnschrift','SF Compact Text','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{display:flex;flex-direction:column;min-height:100vh;gap:10px;padding:14px clamp(10px,3vw,24px) 14px;}

  .app-header{
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border-bottom:2px solid var(--border);padding-bottom:10px;
  }
  h1{margin:0;font-size:clamp(15px,2vw,21px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance;}

  .session-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .tabs-wrap{display:flex;flex-direction:column;gap:6px;}
  .tab-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tab-group .group-label{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);min-width:112px;}
  .tab-btn{
    appearance:none;border:1.5px solid var(--border);background:var(--bg-stage);color:var(--ink);
    font:inherit;font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
    padding:6px 11px;border-radius:5px;cursor:pointer;
  }
  .tab-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .tab-btn.active{background:var(--box-fill-tray);border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent);}
  .tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar .divider{width:1px;align-self:stretch;background:var(--grid-line-major);margin:0 2px;}
  .btn{
    appearance:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);
    background:var(--bg-stage);color:var(--ink);font:inherit;font-weight:600;font-size:11.5px;
    letter-spacing:.03em;text-transform:uppercase;padding:7px 11px;border-radius:5px;cursor:pointer;
  }
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none;}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .rubber-band{position:absolute;border:1.5px dashed var(--accent);background:rgba(201,122,43,.14);pointer-events:none;z-index:60;}

  input[type="color"]{width:32px;height:32px;padding:2px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg-stage);cursor:pointer;}

  .sections-host{flex:1;display:flex;flex-direction:column;}
  .section{display:none;flex-direction:column;gap:10px;flex:1;}
  .section.active{display:flex;}

  .stage-wrap{flex:1;overflow:hidden;border-radius:10px;border:1px solid var(--grid-line-major);background:var(--bg-stage);}
  .stage-scale{position:relative;width:100%;}
  .stage{
    position:absolute;top:0;left:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-major) 1px, transparent 1px);
    background-size:16px 16px,16px 16px,80px 80px,80px 80px;
    background-position:-1px -1px;
    transform-origin:top left;
  }

  .zone{position:absolute;border-radius:12px;cursor:grab;touch-action:none;user-select:none;}
  .zone:active{cursor:grabbing;}
  .zone.selected{outline:2px solid var(--accent);outline-offset:2px;}
  .zone:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .zone-label{position:absolute;top:7px;left:11px;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9;}
  .zone-label[contenteditable="true"]{outline:1px dashed currentColor;border-radius:2px;cursor:text;}
  .zone-strings{background:rgba(139,92,246,.10);border:1.5px dashed rgba(139,92,246,.55);}
  .zone-strings .zone-label{color:#8B5CF6;}
  .zone-woodwind{background:rgba(34,197,94,.10);border:1.5px dashed rgba(34,197,94,.55);}
  .zone-woodwind .zone-label{color:#22C55E;}
  .zone-brass{background:rgba(248,113,113,.10);border:1.5px dashed rgba(248,113,113,.55);}
  .zone-brass .zone-label{color:#F87171;}
  .zone-percussion{background:rgba(34,211,238,.10);border:1.5px dashed rgba(34,211,238,.55);}
  .zone-percussion .zone-label{color:#22D3EE;}

  .edge-label{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);pointer-events:none;}
  .edge-label.audience{top:12px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--accent-ink);}
  .edge-label.backstage{bottom:12px;}
  .edge-label svg{display:block;}

  .item{
    position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:3px;padding:6px 5px 6px;border-radius:6px;background:var(--box-fill);border:1.5px solid var(--border);
    box-shadow:var(--shadow);cursor:grab;touch-action:none;user-select:none;text-align:center;
  }
  .item.tray{background:var(--box-fill-tray);border:1.5px dashed var(--border-tray);}
  .item:active{cursor:grabbing;}
  .item.dragging{box-shadow:var(--shadow-drag);z-index:50;}
  .item.selected{outline:2px solid var(--accent);outline-offset:2px;}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .item .icon{width:26px;height:23px;stroke:var(--ink);fill:none;stroke-width:1.6;flex:none;}
  .item.tray > .label{color:var(--accent-ink);}

  .item .label{font-size:9.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.15;}
  .item .label[contenteditable="true"]{outline:1px dashed var(--accent);border-radius:2px;}

  .item .sub-list{display:flex;flex-direction:row;gap:5px;margin-top:1px;flex-wrap:wrap;justify-content:center;}
  .item .sub-item{display:flex;flex-direction:column;align-items:center;gap:1px;width:44px;}
  .item .sub-item .icon{width:17px;height:15px;stroke:var(--accent-ink);stroke-width:1.5;}
  .item .sub-item span{font-size:7.5px;color:var(--ink-dim);font-weight:600;line-height:1.1;}

  .item .sizes{display:flex;gap:5px;margin-top:1px;font-family:ui-monospace,'Cascadia Mono','SF Mono',Consolas,monospace;font-variant-numeric:tabular-nums;}
  .item .sizes span{font-size:9px;color:var(--ink-dim);font-weight:600;}

  .item.shape{padding:0;background:transparent;}
  .item.shape.square{background:var(--shape-fill,rgba(43,76,120,.12));border-color:var(--shape-color,var(--border));border-width:4px;}
  .item.shape.circle{background:var(--shape-fill,rgba(43,76,120,.12));border-color:var(--shape-color,var(--border));border-width:4px;border-radius:50%;}
  .item.shape.text{
    border:1.5px dashed transparent;background:transparent;box-shadow:none;color:var(--shape-color,var(--ink));
    font-weight:700;font-size:14px;padding:4px 8px;min-width:40px;min-height:24px;justify-content:center;
  }
  .item.shape.text:hover{border-color:var(--grid-line-major);}
  .item.shape.text[contenteditable="true"]{border-color:var(--accent);cursor:text;}

  .resize-handle{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border-radius:3px;background:var(--accent);border:1.5px solid var(--bg-stage);cursor:nwse-resize;touch-action:none;z-index:30;}

  .stage-resize-handle{
    position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;z-index:40;
    background:linear-gradient(135deg, transparent 50%, var(--accent) 50%);opacity:.5;border-radius:0 0 10px 0;
  }
  .stage-resize-handle:hover{opacity:.9;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,16,28,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:var(--bg-stage);border:1.5px solid var(--border);border-radius:10px;padding:18px 20px;width:min(560px,100%);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-drag);}
  .modal h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--grid-line-major);padding-bottom:8px;}
  .modal label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);margin:12px 0 5px;}
  .modal input[type="text"]{width:100%;padding:8px 10px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg-page);color:var(--ink);font:inherit;font-size:13px;}
  .modal select{padding:6px 8px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg-page);color:var(--ink);font:inherit;font-size:12px;max-width:170px;}
  .icon-groups{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .icon-group-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
  .icon-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .icon-pick{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;padding:6px 3px;border-radius:6px;border:1.5px solid var(--border);background:var(--box-fill);cursor:pointer;}
  .icon-pick svg{width:22px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;}
  .icon-pick span{font-size:7.3px;font-weight:600;color:var(--ink-dim);text-align:center;line-height:1.1;}
  .icon-pick.selected{border-color:var(--accent);background:var(--box-fill-tray);}
  .icon-pick.selected span{color:var(--accent-ink);}
  .tray-rows{margin-top:4px;}
  .tray-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .tray-row input[type="text"]{flex:1;}
  .tray-row .rm{border:none;background:transparent;color:var(--danger);cursor:pointer;font-size:17px;font-weight:700;padding:2px 8px;line-height:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  @media (prefers-reduced-motion: no-preference){.item{transition:box-shadow .15s ease;}}
</style>

<div class="app" id="appRoot">
  <div class="app-header">
    <h1>Planos de Escenario — Orquesta y Banda Sinfónica</h1>
    <div class="session-bar">
      <button class="btn" id="exportBtn" type="button" title="Descarga un archivo con tu composición completa">Exportar</button>
      <label class="btn" id="importLabel" title="Carga una composición exportada previamente">Importar<input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
  </div>

  <div class="tabs-wrap" id="tabsWrap"></div>

  <div class="sections-host" id="sectionsHost"></div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel" type="button">Cancelar</button>
      <button class="btn primary" id="modalConfirm" type="button">Crear</button>
    </div>
  </div>
</div>

<script>

    euphonium: icon('<circle cx="16" cy="22" r="10"/><path d="M16 12 Q9 3 2 5" stroke-width="2.2"/>', '0 0 34 34'),
    tuba: icon('<circle cx="22" cy="26" r="13"/><path d="M22 13 Q12 0 2 5" stroke-width="2.6"/>', '0 0 40 44'),
    generic: icon('<circle cx="18" cy="25" r="6"/><line x1="24" y1="25" x2="24" y2="7"/><line x1="24" y1="7" x2="33" y2="9"/>'),
    dot: icon('<circle cx="19" cy="19" r="9"/>', '0 0 38 38')
  };

  var ICON_CATALOG = [
    {key:'violin',label:'Violín / Viola',group:'Cuerda'},
    {key:'cello',label:'Violonchelo',group:'Cuerda'},
    {key:'bass',label:'Contrabajo',group:'Cuerda'},
    {key:'harp',label:'Arpa',group:'Cuerda'},
    {key:'flute',label:'Flauta',group:'Viento'},
    {key:'woodwind',label:'Oboe / Clarinete',group:'Viento'},
    {key:'bassoon',label:'Fagot',group:'Viento'},
    {key:'sax',label:'Saxofón',group:'Viento'},
    {key:'trumpet',label:'Trompeta',group:'Viento'},
    {key:'horn',label:'Trompa',group:'Viento'},
    {key:'trombone',label:'Trombón',group:'Viento'},

  // Curves the first `arcCount` items into a shallow arc that opens toward the
  // audience (edges closest to the public, center further back — like a real
  // string/wind section curving around the conductor); any remaining items
  // (e.g. the harp) sit further back still.
  function curveRow(items, baseY, amplitude, arcCount){
    var n = arcCount === undefined ? items.length : arcCount;
    items.forEach(function(d, i){
      if(i < n){
        var u = n > 1 ? (i / (n - 1)) * 2 - 1 : 0;
        d.y = baseY + amplitude * (1 - u * u);
      } else {
        d.y = baseY + amplitude + 35;
      }
    });
  }
  // Compact, left-anchored curved row (for a section that lives on its own).
  function layoutArc(items, x0, baseY, amplitude, gap, arcCount){
    gap = gap || 16;
    var x = x0;
    items.forEach(function(d){ d.x = x; x += d.w + gap; });
    curveRow(items, baseY, amplitude, arcCount);
    return x - gap;
  }
  // Compact curved row centered on a shared axis (for stacking sections into
  // one fan/wedge silhouette, as in a real orchestra or band layout).
  function layoutArcCentered(items, centerX, baseY, amplitude, gap, arcCount){
    gap = gap || 16;
    var x = 0;
    items.forEach(function(d){ d.x = x; x += d.w + gap; });
    var totalW = x - gap;
    var offset = centerX - totalW / 2;
    items.forEach(function(d){ d.x += offset; });
    curveRow(items, baseY, amplitude, arcCount);
  }
  function bbox(items, padX, padY){
    if(padY === undefined) padY = padX;
    var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    items.forEach(function(d){
      minX = Math.min(minX, d.x); minY = Math.min(minY, d.y);
      maxX = Math.max(maxX, d.x + d.w); maxY = Math.max(maxY, d.y + d.h);
    });
    return { x:minX-padX, y:minY-padY, w:(maxX-minX)+2*padX, h:(maxY-minY)+2*padY };
  }

  function buildIconGrid(selectedKey){
    var wrap = document.createElement('div');
    wrap.className = 'icon-groups';
    var groups = ['Cuerda','Viento','Percusión','Otro'];
    var current = selectedKey || 'generic';
    var buttons = [];
    groups.forEach(function(g){
      var gLabel = document.createElement('div');
      gLabel.className = 'icon-group-label';
      gLabel.textContent = g;
      wrap.appendChild(gLabel);
      var grid = document.createElement('div');
      grid.className = 'icon-grid';
      ICON_CATALOG.filter(function(it){ return it.group === g; }).forEach(function(it){
        var pick = document.createElement('div');
        pick.className = 'icon-pick' + (it.key === current ? ' selected' : '');
        pick.innerHTML = ICONS[it.key] + '<span>' + it.label + '</span>';
        pick.dataset.key = it.key;
        pick.addEventListener('click', function(){
          buttons.forEach(function(b){ b.classList.remove('selected'); });
          pick.classList.add('selected');
          current = it.key;
        });
        buttons.push(pick);
        grid.appendChild(pick);
      });
      wrap.appendChild(grid);
    });
    return { el: wrap, getKey: function(){ return current; } };
  }

        startClientX = e.clientX; startClientY = e.clientY;
        shiftAtDown = e.shiftKey;
        dragging = true; moved = false; members = null;
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
      });
      el.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var dxC = e.clientX - startClientX, dyC = e.clientY - startClientY;
        if(!moved){
          if(Math.abs(dxC) < THRESH && Math.abs(dyC) < THRESH) return;
          moved = true;
          if(shiftAtDown) return;
          el.classList.add('dragging');
          if(!(selectedSet.has(el) && selectedSet.size > 1)) selectOnly(el);
          members = Array.from(selectedSet.size > 1 ? selectedSet : [el]).map(function(m){
            return { el:m, x:parseFloat(m.style.left)||0, y:parseFloat(m.style.top)||0,
                     w:parseFloat(m.dataset.w), h:parseFloat(m.dataset.h) };
          });
        }
        if(shiftAtDown || !members) return;
        var f = scaleFactor();
        var dxV = dxC / f, dyV = dyC / f;
        members.forEach(function(mem){
          var nx = clamp(mem.x + dxV, 0, VIRTUAL_W - mem.w);
          var ny = clamp(mem.y + dyV, 0, VIRTUAL_H - mem.h);
          mem.el.style.left = nx + 'px';
          mem.el.style.top = ny + 'px';
        });
      });
      function release(e){
        if(!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        try{ el.releasePointerCapture(e.pointerId); }catch(err){}
        if(!moved){
          if(shiftAtDown) toggleInSelection(el);
          else selectOnly(el);
        } else {
          scheduleSave();
        }
        members = null;
      }
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);

      el.addEventListener('keydown', function(e){
        if(el.getAttribute('contenteditable') === 'true') return;
        var step = e.shiftKey ? 20 : 5;
        var cur = { left: el.offsetLeft / scaleFactor(), top: el.offsetTop / scaleFactor() };
        var moved = true;
        if(e.key === 'ArrowLeft') cur.left -= step;
        else if(e.key === 'ArrowRight') cur.left += step;
        else if(e.key === 'ArrowUp') cur.top -= step;
        else if(e.key === 'ArrowDown') cur.top += step;
        else moved = false;
        if(moved){
          e.preventDefault();
          var w2 = parseFloat(el.dataset.w), h2 = parseFloat(el.dataset.h);
          el.style.left = clamp(cur.left, 0, VIRTUAL_W - w2) + 'px';
          el.style.top = clamp(cur.top, 0, VIRTUAL_H - h2) + 'px';
          scheduleSave();
        }
      });
    }

    function nextSpot(){
      var col = addCount % 8, row = Math.floor(addCount / 8);
      addCount++;
      return { x: clamp(30 + col * 130, 0, VIRTUAL_W - 100), y: clamp(VIRTUAL_H - 150 + row * 40, 0, VIRTUAL_H - 90) };
    }

    function buildInstrumentEl(def){
      var el = document.createElement('div');
      el.className = 'item' + (def.tray ? ' tray' : '');
      el.style.width = def.w + 'px';
      el.style.left = def.x + 'px';
      el.style.top = def.y + 'px';
      var html = '';
      html += def.icon || '';
      html += '<span class="label">' + def.label + '</span>';
      if(def.sub && def.sub.length){
        html += '<span class="sub-list">' + def.sub.map(function(s){
          var k = s.iconKey || findIconKey(s.icon);
          return '<span class="sub-item" data-icon-key="' + k + '">' + s.icon + '<span>' + s.text + '</span></span>';
        }).join('') + '</span>';
      }
      if(def.sizes){
        html += '<span class="sizes">' + def.sizes.map(function(s){ return '<span>' + s + '</span>'; }).join('') + '</span>';
      }
      el.innerHTML = html;
      if(!def.tray && def.icon) el.dataset.iconKey = def.iconKey || findIconKey(def.icon);
      stage.appendChild(el);
      makeInteractive(el, def.w, def.h);
      enableInlineEdit(el.querySelector('.label'));
      return el;
    }

    function buildZones(){
      if(!cfg.zones) return;
      cfg.zones.forEach(function(z){
        var zoneEl = document.createElement('div');
        zoneEl.className = 'zone zone-' + z.kind;
        zoneEl.style.left = z.box.x + 'px';
        zoneEl.style.top = z.box.y + 'px';
        zoneEl.style.width = z.box.w + 'px';
        zoneEl.style.height = z.box.h + 'px';
        zoneEl.innerHTML = '<span class="zone-label">' + z.label + '</span>';
        stage.appendChild(zoneEl);
        makeInteractive(zoneEl, z.box.w, z.box.h);
        addResizeHandle(zoneEl, false);
        enableInlineEdit(zoneEl.querySelector('.zone-label'));
      });
    }

    buildZones();
    cfg.items.forEach(buildInstrumentEl);

    var stageHandle = document.createElement('div');
    stageHandle.className = 'stage-resize-handle';
    stageHandle.title = 'Arrastra para ampliar o reducir el escenario';
    stage.appendChild(stageHandle);
    stageHandle.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      try{ stageHandle.setPointerCapture(e.pointerId); }catch(err){}
      var startX = e.clientX, startY = e.clientY;
      var startW = VIRTUAL_W, startH = VIRTUAL_H;
      function move(ev){
        var f = scaleFactor();
        VIRTUAL_W = Math.max(500, startW + (ev.clientX - startX) / f);
        VIRTUAL_H = Math.max(280, startH + (ev.clientY - startY) / f);
        stage.style.width = VIRTUAL_W + 'px';
        stage.style.height = VIRTUAL_H + 'px';
        updateScale();
      }
      function up(ev){
        try{ stageHandle.releasePointerCapture(ev.pointerId); }catch(err){}
        stageHandle.removeEventListener('pointermove', move);
        stageHandle.removeEventListener('pointerup', up);
        scheduleSave();
      }
      stageHandle.addEventListener('pointermove', move);
      stageHandle.addEventListener('pointerup', up);
    });

    function addResizeHandle(el, isCircle){
      var handle = document.createElement('div');
      handle.className = 'resize-handle';
      el.appendChild(handle);
      handle.addEventListener('pointerdown', function(e){
        e.stopPropagation();
        selectOnly(el);
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        var startX = e.clientX, startY = e.clientY;
        var startW = parseFloat(el.dataset.w), startH = parseFloat(el.dataset.h);
        function move(ev){
          var f = scaleFactor();
          var dw = (ev.clientX - startX) / f, dh = (ev.clientY - startY) / f;
          var nw = clamp(startW + dw, 30, VIRTUAL_W);
          var nh = isCircle ? nw : clamp(startH + dh, 30, VIRTUAL_H);
          el.style.width = nw + 'px'; el.style.height = nh + 'px';
          el.dataset.w = nw; el.dataset.h = nh;
        }
        function up(ev){
          try{ handle.releasePointerCapture(ev.pointerId); }catch(err){}
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', up);
          scheduleSave();
        }
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
      });
    }

    function addShape(kind){
      var spot = nextSpot(), size = 90;
      var el = document.createElement('div');
      el.className = 'item shape ' + kind;
      el.style.width = size + 'px'; el.style.height = size + 'px';
      el.style.left = spot.x + 'px'; el.style.top = spot.y + 'px';
      el.style.setProperty('--shape-color', colorPicker.value);
      stage.appendChild(el);
      makeInteractive(el, size, size);
      addResizeHandle(el, kind === 'circle');
      selectOnly(el);
      scheduleSave();
    }

    function addText(){
      var spot = nextSpot();
      var el = document.createElement('div');
      el.className = 'item shape text';
      el.style.left = spot.x + 'px'; el.style.top = spot.y + 'px';
      el.style.color = colorPicker.value;
      el.textContent = 'Texto';
      stage.appendChild(el);
      makeInteractive(el, 70, 26);
      enableInlineEdit(el);
      selectOnly(el);
      setTimeout(function(){
        el.setAttribute('contenteditable', 'true');
        el.focus();
        document.execCommand('selectAll', false, null);
      }, 0);
      scheduleSave();
    }

    function openEditModal(el){
      if(!el) return;
      if(el.classList.contains('zone')){
        var zoneLabel = el.querySelector('.zone-label');
        openRenameModal('Modificar subtítulo de sección', zoneLabel.textContent, function(v){ zoneLabel.textContent = v; scheduleSave(); });
        return;
      }
      if(el.classList.contains('shape')){
        if(el.classList.contains('text')){
          openRenameModal('Modificar texto', el.textContent, function(v){ el.textContent = v; scheduleSave(); });
        }
        return;
      }
      var labelSpan = el.querySelector('.label');
      if(!labelSpan) return;
      if(el.classList.contains('tray')){
        openRenameModal('Modificar bandeja', labelSpan.textContent, function(v){ labelSpan.textContent = v; scheduleSave(); });
        return;
      }
      openEditInstrumentModal(labelSpan.textContent, el.dataset.iconKey || 'generic', function(name, iconKey){
        labelSpan.textContent = name;
        var iconHolder = el.querySelector('.icon');
        if(iconHolder) iconHolder.outerHTML = ICONS[iconKey] || ICONS.generic;
        el.dataset.iconKey = iconKey;
        scheduleSave();
      });
    }

    container.querySelectorAll('[data-act]').forEach(function(btn){
      var act = btn.dataset.act;
      if(act === 'instrument'){
        btn.addEventListener('click', function(){
          openAddInstrumentModal(function(name, iconKey){
            var spot = nextSpot();
            buildInstrumentEl({label:name, icon:ICONS[iconKey]||ICONS.generic, w:96, h:84, x:spot.x, y:spot.y});
            scheduleSave();
          });
        });
      } else if(act === 'tray'){
        btn.addEventListener('click', function(){
          openAddTrayModal(function(name, subs){
            var w = Math.max(110, subs.length * 50 + 20);
            var spot = nextSpot();
            buildInstrumentEl({label:name, tray:true, w:w, h:104, x:spot.x, y:spot.y, sub: subs});
            scheduleSave();
          });
        });
      } else if(act === 'square' || act === 'circle'){
        btn.addEventListener('click', function(){ addShape(act); });
      } else if(act === 'text'){
        btn.addEventListener('click', addText);
      } else if(act === 'edit'){
        btn.addEventListener('click', function(){
          if(selectedSet.size === 1) openEditModal(Array.from(selectedSet)[0]);
        });
      } else if(act === 'delete'){
        btn.addEventListener('click', function(){
          selectedSet.forEach(function(el){ el.remove(); });
          selectedSet.clear();
          scheduleSave();
        });
      } else if(act === 'reset'){
        btn.addEventListener('click', function(){
          stage.querySelectorAll('.item, .zone').forEach(function(it){ it.remove(); });
          addCount = 0; selectedSet.clear();
          VIRTUAL_W = cfg.vw; VIRTUAL_H = cfg.vh;
          stage.style.width = VIRTUAL_W + 'px';
          stage.style.height = VIRTUAL_H + 'px';
          buildZones();
          cfg.items.forEach(buildInstrumentEl);
          updateScale();
          scheduleSave();
        });
      }
    });

    stage.addEventListener('pointerdown', function(e){
      if(e.target !== stage) return;
      var stageRect = stage.getBoundingClientRect();
      var f = scaleFactor();
      var startX = (e.clientX - stageRect.left) / f, startY = (e.clientY - stageRect.top) / f;
      var shiftHeld = e.shiftKey;

      var band = document.createElement('div');
      band.className = 'rubber-band';
      stage.appendChild(band);
      var bandMoved = false, lastRect = {x:startX,y:startY,w:0,h:0};

      function updateBand(curX, curY){
        var x = Math.min(startX, curX), y = Math.min(startY, curY);
        var w = Math.abs(curX - startX), h = Math.abs(curY - startY);
        band.style.left = x + 'px'; band.style.top = y + 'px';
        band.style.width = w + 'px'; band.style.height = h + 'px';
        lastRect = {x:x,y:y,w:w,h:h};
      }
      updateBand(startX, startY);
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}

      function move(ev){
        var cx = (ev.clientX - stageRect.left) / f, cy = (ev.clientY - stageRect.top) / f;
        if(Math.abs(cx - startX) > 3 || Math.abs(cy - startY) > 3) bandMoved = true;
        updateBand(cx, cy);
      }
      function up(ev){
        try{ stage.releasePointerCapture(ev.pointerId); }catch(err){}
        stage.removeEventListener('pointermove', move);
        stage.removeEventListener('pointerup', up);
        band.remove();
        if(bandMoved){
          if(!shiftHeld) clearSelection();
          stage.querySelectorAll('.item, .zone').forEach(function(cand){
            var cx0 = parseFloat(cand.style.left) || 0, cy0 = parseFloat(cand.style.top) || 0;
            var cw = parseFloat(cand.dataset.w) || cand.offsetWidth, ch = parseFloat(cand.dataset.h) || cand.offsetHeight;
            var hit = cx0 < lastRect.x + lastRect.w && cx0 + cw > lastRect.x && cy0 < lastRect.y + lastRect.h && cy0 + ch > lastRect.y;
            if(hit) addToSelection(cand);
          });
        } else if(!shiftHeld){
          clearSelection();
        }
      }
      stage.addEventListener('pointermove', move);
      stage.addEventListener('pointerup', up);
    });

    document.addEventListener('keydown', function(e){
      if(!container.classList.contains('active')) return;
      if(document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('contenteditable') === 'true') return;
      if((e.key === 'Delete' || e.key === 'Backspace') && selectedSet.size){
        e.preventDefault();
        selectedSet.forEach(function(el){ el.remove(); });
        selectedSet.clear();
        scheduleSave();
      }
      if(e.key === 'Escape') clearSelection();
    });

    var resizeTimer;
    window.addEventListener('resize', function(){
      if(!container.classList.contains('active')) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(updateScale, 100);
    });

    function serialize(){
      var data = { vw: VIRTUAL_W, vh: VIRTUAL_H, zones: [], items: [] };
      stage.querySelectorAll(':scope > .zone').forEach(function(z){
        var kindClass = Array.prototype.find.call(z.classList, function(c){ return c.indexOf('zone-') === 0; });
        data.zones.push({
          label: z.querySelector('.zone-label').textContent,
          kind: kindClass ? kindClass.replace('zone-', '') : 'strings',
          x: parseFloat(z.style.left) || 0, y: parseFloat(z.style.top) || 0,
          w: parseFloat(z.dataset.w), h: parseFloat(z.dataset.h)
        });
      });
      stage.querySelectorAll(':scope > .item').forEach(function(el){
        var x = parseFloat(el.style.left) || 0, y = parseFloat(el.style.top) || 0;
        var w = parseFloat(el.dataset.w), h = parseFloat(el.dataset.h);
        if(el.classList.contains('shape')){
          if(el.classList.contains('text')){
            data.items.push({kind:'text', text: el.textContent, x:x, y:y, w:w, h:h, color: el.style.color});
          } else {
            data.items.push({kind: el.classList.contains('circle') ? 'circle' : 'square', x:x, y:y, w:w, h:h, color: el.style.getPropertyValue('--shape-color')});
          }
        } else if(el.classList.contains('tray')){
          var subs = [];
          el.querySelectorAll('.sub-item').forEach(function(si){
            subs.push({iconKey: si.dataset.iconKey || 'dot', text: si.querySelector('span').textContent});
          });
          var sizesEl = el.querySelector('.sizes');
          var sizes = sizesEl ? Array.prototype.map.call(sizesEl.querySelectorAll('span'), function(s){ return s.textContent; }) : null;
          data.items.push({kind:'tray', label: el.querySelector('.label').textContent, x:x, y:y, w:w, h:h, sub:subs, sizes:sizes});
        } else {
          data.items.push({kind:'instrument', label: el.querySelector('.label').textContent, iconKey: el.dataset.iconKey || 'generic', x:x, y:y, w:w, h:h});
        }
      });
      return data;
    }

    function loadSnapshot(data){
      if(!data) return;
      stage.querySelectorAll('.item, .zone').forEach(function(it){ it.remove(); });
      selectedSet.clear(); addCount = 0;
      VIRTUAL_W = data.vw || cfg.vw; VIRTUAL_H = data.vh || cfg.vh;
      stage.style.width = VIRTUAL_W + 'px';
      stage.style.height = VIRTUAL_H + 'px';
      (data.zones || []).forEach(function(z){
        var zoneEl = document.createElement('div');
        zoneEl.className = 'zone zone-' + z.kind;
        zoneEl.style.left = z.x + 'px'; zoneEl.style.top = z.y + 'px';
        zoneEl.style.width = z.w + 'px'; zoneEl.style.height = z.h + 'px';
        zoneEl.innerHTML = '<span class="zone-label">' + z.label + '</span>';
        stage.appendChild(zoneEl);
        makeInteractive(zoneEl, z.w, z.h);
        addResizeHandle(zoneEl, false);
        enableInlineEdit(zoneEl.querySelector('.zone-label'));
      });
      (data.items || []).forEach(function(it){
        if(it.kind === 'instrument'){
          buildInstrumentEl({label:it.label, icon:ICONS[it.iconKey]||ICONS.generic, iconKey:it.iconKey, w:it.w, h:it.h, x:it.x, y:it.y});
        } else if(it.kind === 'tray'){
          var subs = (it.sub || []).map(function(s){ return {icon: ICONS[s.iconKey]||ICONS.dot, iconKey:s.iconKey, text:s.text}; });
          buildInstrumentEl({label:it.label, tray:true, w:it.w, h:it.h, x:it.x, y:it.y, sub:subs, sizes:it.sizes||undefined});
        } else if(it.kind === 'square' || it.kind === 'circle'){
          var el = document.createElement('div');
          el.className = 'item shape ' + it.kind;
          el.style.width = it.w + 'px'; el.style.height = it.h + 'px';
          el.style.left = it.x + 'px'; el.style.top = it.y + 'px';
          el.style.setProperty('--shape-color', it.color || '#2B4C78');
          stage.appendChild(el);
          makeInteractive(el, it.w, it.h);
          addResizeHandle(el, it.kind === 'circle');
        } else if(it.kind === 'text'){
          var tEl = document.createElement('div');
          tEl.className = 'item shape text';
          tEl.style.left = it.x + 'px'; tEl.style.top = it.y + 'px';
          tEl.style.color = it.color || '#14335C';
          tEl.textContent = it.text;
          stage.appendChild(tEl);
          makeInteractive(tEl, it.w || 70, it.h || 26);
          enableInlineEdit(tEl);
        }
      });
      updateScale();
    }

    return { id: cfg.id, container: container, updateScale: updateScale, serialize: serialize, loadSnapshot: loadSnapshot };
  }

  //=== Assemble app ==========================================================
  var tabsWrap = document.getElementById('tabsWrap');
  var sectionsHost = document.getElementById('sectionsHost');
  var groupsOrder = [];
  var groupMap = {};

  SECTIONS.forEach(function(cfg){
    if(!groupMap[cfg.group]){ groupMap[cfg.group] = []; groupsOrder.push(cfg.group); }
    groupMap[cfg.group].push(cfg);
  });

  var apis = {};
  var tabButtons = {};

  function activate(id){
    Object.keys(apis).forEach(function(k){
      apis[k].container.classList.toggle('active', k === id);
      tabButtons[k].classList.toggle('active', k === id);
    });
    apis[id].updateScale();
  }

  groupsOrder.forEach(function(g){
    var row = document.createElement('div');
    row.className = 'tab-group';
    var gl = document.createElement('span');
    gl.className = 'group-label';
    gl.textContent = g;
    row.appendChild(gl);

    groupMap[g].forEach(function(cfg){
      var api = createSection(cfg);
      apis[cfg.id] = api;
      sectionsHost.appendChild(api.container);

      var tb = document.createElement('button');
      tb.type = 'button';
      tb.className = 'tab-btn';
      tb.textContent = cfg.label;
      tb.addEventListener('click', function(){ activate(cfg.id); });
      tabButtons[cfg.id] = tb;
      row.appendChild(tb);
    });

    tabsWrap.appendChild(row);
  });

  activate(SECTIONS[0].id);

  //=== Persistence (local autosave + manual export/import) ==================
  var AUTOSAVE_KEY = 'planoOrquestaAutosave';
  var saveTimer = null;

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 600);
  }
  function collectAllData(){
    var data = {};
    Object.keys(apis).forEach(function(id){ data[id] = apis[id].serialize(); });
    return data;
  }
  function saveNow(){
    try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(collectAllData())); }catch(err){}
  }
  function loadAutosave(){
    try{
      var raw = localStorage.getItem(AUTOSAVE_KEY);
      if(!raw) return;
      var data = JSON.parse(raw);
      Object.keys(data).forEach(function(id){ if(apis[id]) apis[id].loadSnapshot(data[id]); });
    }catch(err){}
  }

  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(collectAllData(), null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'plano-orquesta.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        Object.keys(data).forEach(function(id){ if(apis[id]) apis[id].loadSnapshot(data[id]); });
        scheduleSave();
        alert('Composición importada correctamente.');
      }catch(err){
        alert('No se pudo leer el archivo. Asegúrate de que es una copia exportada desde esta misma herramienta.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  loadAutosave();
  apis[Object.keys(apis).filter(function(id){ return apis[id].container.classList.contains('active'); })[0] || SECTIONS[0].id].updateScale();
})();
</script>
